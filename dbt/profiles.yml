flight_delays:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('DBT_DATASET') }}"
      keyfile: /opt/airflow/credentials/gcp-key.json
      location: US
      threads: 4
      timeout_seconds: 300
